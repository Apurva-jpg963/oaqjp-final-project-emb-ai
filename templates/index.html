<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 48px;
            max-width: 700px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #e94560, #0f3460, #533483);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-bottom: 36px;
            font-size: 0.95rem;
        }
        textarea {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            outline: none;
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: #e94560; }
        textarea::placeholder { color: rgba(255,255,255,0.35); }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(90deg, #e94560, #533483);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
        }
        button:hover { opacity: 0.88; transform: translateY(-2px); }
        #output {
            margin-top: 28px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 0.95rem;
            line-height: 1.7;
            min-height: 60px;
            color: rgba(255,255,255,0.9);
            display: none;
        }
        #output.show { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Emotion Detector</h1>
        <p class="subtitle">Powered by IBM Watson NLP</p>

        <textarea id="textToAnalyze" placeholder="Enter text to analyze emotions... e.g., 'I am so happy today!'"></textarea>

        <button onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>

        <div id="output"></div>
    </div>

    <script>
        function RunSentimentAnalysis() {
            const text = document.getElementById('textToAnalyze').value.trim();
            const output = document.getElementById('output');

            if (!text) {
                output.innerHTML = '<span class="error">Please enter some text before analyzing.</span>';
                output.className = 'show';
                return;
            }

            output.innerHTML = 'Analyzing emotions...';
            output.className = 'show';

            const xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState === 4 && this.status === 200) {
                    output.innerHTML = this.responseText;
                }
            };
            xhttp.open("GET", "emotionDetector?textToAnalyze=" + encodeURIComponent(text), true);
            xhttp.send();
        }
    </script>
</body>
</html>
